<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>YouTube 频道热门视频查询</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        padding: 28px;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        max-width: 1400px;
        margin: 0 auto;
        background: #f7f6fb;
        color: #34324a;
    }

    h3 {
        margin: 0 0 22px;
        font-size: 20px;
        font-weight: 600;
        color: #4d426f;
        letter-spacing: 0.2px;
    }

    .control-row {
        margin: 12px 0;
        padding: 18px 20px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        background: #ffffff;
        border: 1px solid #e7e3f0;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(88, 73, 125, 0.06);
    }

    .control-row label {
        font-size: 14px;
        color: #625d72;
    }

    input,
    select {
        height: 38px;
        padding: 7px 12px;
        font-size: 14px;
        color: #403b50;
        background: #fbfaff;
        border: 1px solid #dcd7e8;
        border-radius: 7px;
        outline: none;
        transition: all 0.2s ease;
    }

    input {
        width: 230px;
    }

    select {
        min-width: 155px;
    }

    input:focus,
    select:focus {
        border-color: #8b7bb8;
        box-shadow: 0 0 0 3px rgba(139, 123, 184, 0.12);
        background: #ffffff;
    }

    button {
        height: 38px;
        padding: 0 18px;
        cursor: pointer;
        font-size: 14px;
        border: none;
        color: #ffffff;
        border-radius: 7px;
        background: #6f63a8;
        transition: all 0.2s ease;
    }

    button:hover {
        opacity: 0.92;
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(111, 99, 168, 0.18);
    }

    button.export {
        background: #4f9f9a;
    }

    button.export:hover {
        box-shadow: 0 4px 10px rgba(79, 159, 154, 0.18);
    }

    #loading {
        margin: 16px 2px 10px;
        min-height: 20px;
        color: #716b80;
        font-size: 13px;
    }

    table {
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 12px;
        width: 100%;
        font-size: 13px;
        background: #ffffff;
        border: 1px solid #e5e1ed;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 14px rgba(88, 73, 125, 0.05);
    }

    th,
    td {
        border: none;
        border-bottom: 1px solid #eeeaf3;
        padding: 10px 9px;
        text-align: left;
    }

    th {
        background: #f0edf8;
        color: #574d75;
        font-weight: 600;
        white-space: nowrap;
    }

    tr:last-child td {
        border-bottom: none;
    }

    tbody tr {
        transition: background 0.15s ease;
    }

    tbody tr:hover {
        background: #f8f7fc;
    }

    td {
        color: #4b4757;
    }

    td a {
        color: #4f8583;
        text-decoration: none;
        word-break: break-all;
    }

    td a:hover {
        color: #7567a8;
        text-decoration: underline;
    }

    .short-tag,
    .long-tag {
        display: inline-block;
        padding: 3px 8px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 500;
    }

    .short-tag {
        color: #a05b76;
        background: #f6eaf0;
    }

    .long-tag {
        color: #527e7b;
        background: #e8f3f1;
    }
</style>


</head>
<body>
    <h3>YouTube 近一年热门视频查询（按播放量排序）</h3>
    <div class="control-row">
        <label>频道ID(UC开头)：</label>
        <input type="text" id="channelId" placeholder="输入 UCxxxxxx">
        <label>视频筛选：</label>
        <select id="filterType">
            <option value="all">全部视频</option>
            <option value="long">仅长视频(>60s)</option>
            <option value="short">仅Shorts(≤60s)</option>
        </select>
        <button onclick="getVideoList()">开始查询</button>
        <button class="export" onclick="exportCsv()">导出CSV</button>
    </div>
    <div id="loading"></div>
    <table id="resultTable">
        <thead>
            <tr>
                <th>排名</th>
                <th>标题</th>
                <th>时长</th>
                <th>类型</th>
                <th>播放量</th>
                <th>发布时间</th>
                <th>视频链接</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
<script>
// ========= Worker代理配置 =========
const WORKER_URL = "https://curly-hat-3b7c.zhouhongjian.workers.dev/";
const PROXY_SECRET = "zhj123xyz789secret";
const DAY_LIMIT = 365; // 筛选近1年
// ============================================

// 【代理请求封装，转发到Cloudflare Worker】
async function apiProxy(endpoint, paramsObj){
    const urlParams = new URLSearchParams();
    urlParams.set("endpoint", endpoint);
    Object.entries(paramsObj).forEach(([k,v])=>{
        if(v !== undefined && v !== null && v !== ""){
            urlParams.set(k, v);
        }
    });
    const reqUrl = WORKER_URL + "?" + urlParams.toString();
    const res = await fetch(reqUrl, {
        method:"GET",
        headers:{
            "X-Pro-Token": PROXY_SECRET
        }
    });
    const rawText = await res.text();
    let data;
    try{
        data = JSON.parse(rawText);
    }catch(e){
        throw new Error(rawText || "Worker返回非JSON");
    }
    if(!res.ok) throw new Error(data?.error?.message || "API请求失败");
    return data;
}

// ISO8601时长 PT1H2M3S → 总秒数
function parseIsoDuration(durationStr){
    let sec = 0;
    const h = durationStr.match(/(\d+)H/);
    const m = durationStr.match(/(\d+)M/);
    const s = durationStr.match(/(\d+)S/);
    if(h) sec += parseInt(h[1])*3600;
    if(m) sec += parseInt(m[1])*60;
    if(s) sec += parseInt(s[1]);
    return sec;
}
// 清空结果
function clearResult(){
    document.getElementById("loading").innerText = "";
    document.querySelector("#resultTable tbody").innerHTML = "";
}
// 1. 获取频道上传播放列表ID
async function getUploadPlaylistId(channelId){
    const data = await apiProxy("channels", {
        part:"contentDetails",
        id: channelId
    });
    if(!data.items || data.items.length === 0) throw new Error("频道ID错误");
    return data.items[0].contentDetails.relatedPlaylists.uploads;
}
// 2. 分页获取所有视频基础信息
async function getAllVideoItems(playlistId){
    let list = [];
    let pageToken = "";
    do{
        const data = await apiProxy("playlistItems", {
            part:"snippet",
            maxResults:50,
            playlistId: playlistId,
            pageToken: pageToken
        });
        if(data.items) list = list.concat(data.items);
        pageToken = data.nextPageToken || "";
    }while(pageToken);
    return list;
}
// 3. 批量获取播放量、时长，过滤近一年
async function getVideoStats(videoItems){
    let filterVideos = [];
    const oneYearAgo = new Date();
    oneYearAgo.setDate(oneYearAgo.getDate() - DAY_LIMIT);
    for(let i=0; i<videoItems.length; i+=50){
        const batch = videoItems.slice(i, i+50);
        const ids = batch.map(item => item.snippet.resourceId.videoId).join(",");
        const data = await apiProxy("videos", {
            part:"statistics,snippet,contentDetails",
            id: ids
        });
        data.items.forEach((item, idx) => {
            const pubTime = new Date(batch[idx].snippet.publishedAt);
            if(pubTime < oneYearAgo) return;
            const totalSec = parseIsoDuration(item.contentDetails.duration);
            const isShort = totalSec <= 60;
            filterVideos.push({
                title: batch[idx].snippet.title,
                views: Number(item.statistics.viewCount || 0),
                publish: batch[idx].snippet.publishedAt.split("T")[0],
                url: `https://www.youtube.com/watch?v=${batch[idx].snippet.resourceId.videoId}`,
                durationSec: totalSec,
                durationText: formatSeconds(totalSec),
                isShort: isShort
            })
        })
    }
    // 播放量降序
    return filterVideos.sort((a,b) => b.views - a.views);
}
// 秒 → 00:00 / 01:20:11
function formatSeconds(s){
    const h = Math.floor(s/3600);
    const m = Math.floor((s%3600)/60);
    const sec = s%60;
    if(h>0){
        return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }else{
        return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }
}
// 主入口
async function getVideoList(){
    clearResult();
    const channelId = document.getElementById("channelId").value.trim();
    const filterType = document.getElementById("filterType").value;
    if(!channelId){
        alert("请输入频道ID");
        return;
    }
    document.getElementById("loading").innerText = "正在加载，请稍等...";
    try{
        const playlistId = await getUploadPlaylistId(channelId);
        const allVideos = await getAllVideoItems(playlistId);
        let result = await getVideoStats(allVideos);
        // 前端筛选 Shorts /长视频
        if(filterType === "short"){
            result = result.filter(x=>x.isShort);
        }else if(filterType === "long"){
            result = result.filter(x=>!x.isShort);
        }
        renderTable(result);
        document.getElementById("loading").innerText = `查询完成，共 ${result.length} 条近一年视频`;
    }catch(err){
        document.getElementById("loading").innerText = "查询失败：" + err.message;
        console.error(err);
    }
}
// 渲染表格，链接直接展示完整url
function renderTable(list){
    const tbody = document.querySelector("#resultTable tbody");
    list.forEach((item, index) => {
        const tr = document.createElement("tr");
        const typeText = item.isShort ? '<span class="short-tag">Shorts</span>' : '<span class="long-tag">长视频</span>';
        tr.innerHTML = `
            <td>${index+1}</td>
            <td>${escapeHtml(item.title)}</td>
            <td>${item.durationText}</td>
            <td>${typeText}</td>
            <td>${item.views.toLocaleString()}</td>
            <td>${item.publish}</td>
            <td><a href="${item.url}" target="_blank">${escapeHtml(item.url)}</a></td>
        `;
        tbody.appendChild(tr);
    })
}
function escapeHtml(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
// 导出CSV（带UTF‑8 BOM，Excel不乱码）
function exportCsv(){
    const tbody = document.querySelector("#resultTable tbody");
    const rows = tbody.querySelectorAll("tr");
    if(rows.length ===0){
        alert("暂无数据，无法导出");
        return;
    }
    let csvRows = [];
    //表头
    csvRows.push(["排名","标题","时长","类型","播放量","发布时间","视频链接"]);
    for(const tr of rows){
        const tds = tr.querySelectorAll("td");
        const row = [];
        row.push(tds[0].innerText.trim());
        row.push(tds[1].innerText.trim());
        row.push(tds[2].innerText.trim());
        row.push(tds[3].innerText.trim());
        row.push(tds[4].innerText.trim());
        row.push(tds[5].innerText.trim());
        row.push(tds[6].innerText.trim());
        csvRows.push(row);
    }
    //转csv字符串，每个字段加双引号
    const csv = csvRows.map(r=> r.map(cell=> `"${cell.replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob(["\ufeff"+csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "youtube_video_export.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}
</script>
</body>
</html>
